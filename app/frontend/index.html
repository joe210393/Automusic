<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Music MVP Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background: #f7fafc;
      color: #222;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 24px 28px 32px;
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
    }
    .section-title {
      font-weight: 600;
      margin: 24px 0 8px;
    }
    .card {
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      padding: 16px 18px;
      margin-bottom: 12px;
      background: #f9fafb;
    }
    button {
      border-radius: 999px;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #2563eb;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #4b5563;
    }
    input[type="number"], select {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      min-width: 80px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
    }
    .row > div {
      display: flex;
      flex-direction: column;
    }
    .status {
      font-size: 13px;
      color: #6b7280;
      margin-top: 8px;
      white-space: pre-line;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e5f2ff;
      color: #1d4ed8;
      font-size: 12px;
      margin-right: 6px;
    }
    audio {
      width: 100%;
      margin-top: 8px;
    }
    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      .container {
        padding: 18px 16px 24px;
      }
    }
  </style>
  <!-- 使用 Tone.js + @tonejs/midi 在前端播放 MIDI（免費、純前端） -->
  <script src="https://unpkg.com/tone@14.8.39/build/Tone.js"></script>
  <script src="https://unpkg.com/@tonejs/midi@2.0.27/build/Midi.js"></script>
</head>
<body>
  <div class="container">
    <h1>Music Education MVP Demo</h1>
    <p style="font-size:13px;color:#4b5563;max-width:720px;">
      錄一小段單音旋律 → 系統幫你分析音符與調性 → 選擇 BPM 與風格 → 自動編曲並在線上播放。
      （MVP 僅支援單音旋律，建議 5–15 秒、安靜環境錄音）
    </p>

    <!-- 錄音區塊 -->
    <div class="card">
      <div class="section-title">1. 錄製你的單音旋律</div>
      <div class="row" style="margin-top:6px;">
        <button id="recordBtn">🎙 開始錄音</button>
        <button id="resetRecordingBtn" class="secondary" disabled>重錄</button>
        <span id="recordTimer" style="font-size:13px;color:#6b7280;">尚未錄音</span>
      </div>
      <div id="recordingStatus" class="status"></div>
      <audio id="previewAudio" controls style="display:none;"></audio>
    </div>

    <!-- 音階生成旋律區塊（不需要錄音） -->
    <div class="card">
      <div class="section-title">1b. 或：輸入音階，直接生成旋律（免錄音）</div>
      <div class="row" style="margin-top:6px;">
        <div>
          <label for="rootSelect">根音</label>
          <select id="rootSelect">
            <option value="C" selected>C</option>
            <option value="C#">C#</option>
            <option value="D">D</option>
            <option value="Eb">Eb</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="F#">F#</option>
            <option value="G">G</option>
            <option value="Ab">Ab</option>
            <option value="A">A</option>
            <option value="Bb">Bb</option>
            <option value="B">B</option>
          </select>
        </div>
        <div>
          <label for="scaleSelect">音階</label>
          <select id="scaleSelect">
            <option value="major" selected>大調</option>
            <option value="minor">小調</option>
            <option value="major_pentatonic">大調五聲</option>
            <option value="minor_pentatonic">小調五聲</option>
            <option value="custom">自訂音名</option>
          </select>
        </div>
        <div id="customNotesWrap" style="display:none;">
          <label for="customNotesInput">自訂音名（空格分隔）</label>
          <input id="customNotesInput" type="text" placeholder="例如：C D E G A"
                 style="padding:6px 10px;border-radius:999px;border:1px solid #d1d5db;font-size:14px;min-width:160px;" />
        </div>
        <div>
          <label for="barsInput">小節數</label>
          <input id="barsInput" type="number" min="1" max="16" value="4" />
        </div>
        <div style="margin-top:16px;">
          <button id="generateMelodyBtn">🎲 生成旋律</button>
        </div>
        <div style="margin-top:16px;">
          <button id="playMelodyBtn" class="secondary" disabled>▶ 試聽旋律</button>
        </div>
      </div>
      <div id="melodyStatus" class="status"></div>
    </div>

    <!-- 參數設定與分析結果 -->
    <div class="card">
      <div class="section-title">2. 分析與設定</div>
      <div class="row" style="margin-top:6px;">
        <div>
          <label for="bpmInput">BPM（速度）</label>
          <input id="bpmInput" type="number" min="60" max="160" value="90" />
        </div>
        <div>
          <label for="styleSelect">風格</label>
          <select id="styleSelect">
            <option value="pop-edu" selected>Pop / Education（預設）</option>
            <option value="soft">Soft（溫柔鋼琴伴奏）— 預留</option>
          </select>
        </div>
        <div style="margin-top:16px;">
          <button id="analyzeBtn" class="secondary" disabled>分析旋律 ＋ 建伴奏</button>
        </div>
      </div>
      <div id="analysisInfo" class="status"></div>
      <div id="aiChordsInfo" class="status"></div>
    </div>

    <!-- 播放區塊 -->
    <div class="card">
      <div class="section-title">3. 產生作品並播放</div>
      <div class="row" style="margin-top:6px;">
        <button id="aiChordsBtn" class="secondary" disabled>✨ AI 建議和弦</button>
        <button id="renderBtn" disabled>🎼 產生編曲 MIDI</button>
        <button id="playBtn" class="secondary" disabled>▶ 播放編曲</button>
        <a id="downloadLink" href="#" download="full.mid" style="display:none;font-size:13px;">下載 MIDI</a>
      </div>
      <div id="renderStatus" class="status"></div>
    </div>
  </div>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const resetRecordingBtn = document.getElementById('resetRecordingBtn');
    const recordTimer = document.getElementById('recordTimer');
    const recordingStatus = document.getElementById('recordingStatus');
    const previewAudio = document.getElementById('previewAudio');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const analysisInfo = document.getElementById('analysisInfo');
    const aiChordsInfo = document.getElementById('aiChordsInfo');
    const bpmInput = document.getElementById('bpmInput');
    const styleSelect = document.getElementById('styleSelect');
    const aiChordsBtn = document.getElementById('aiChordsBtn');
    const renderBtn = document.getElementById('renderBtn');
    const playBtn = document.getElementById('playBtn');
    const renderStatus = document.getElementById('renderStatus');
    const downloadLink = document.getElementById('downloadLink');

    // --- 錄音（使用 Web Audio + 自行產生 WAV，確保後端可以讀取） ---
    let audioContext = null;
    let mediaStream = null;
    let scriptNode = null;
    let recordingBuffers = [];
    let recordingStartTime = null;
    let recordingTimerInterval = null;
    let recordedBlob = null;

    let lastAnalyzeResult = null; // { notes, bpm, key }
    let lastMidiBlob = null;      // 伺服器回傳的 MIDI 檔案
    let lastAIChords = null;      // 例如 ["I","V","vi","IV"]

    function setStatus(el, text) {
      el.textContent = text || '';
    }

    function formatSeconds(sec) {
      if (!sec && sec !== 0) return '';
      return sec.toFixed(1) + ' 秒';
    }

    function startTimer() {
      recordingStartTime = Date.now();
      recordTimer.textContent = '錄音中…';
      if (recordingTimerInterval) clearInterval(recordingTimerInterval);
      recordingTimerInterval = setInterval(() => {
        const elapsed = (Date.now() - recordingStartTime) / 1000;
        recordTimer.textContent = `錄音中：${formatSeconds(elapsed)}（建議 5–15 秒）`;
      }, 100);
    }

    function stopTimer() {
      if (recordingTimerInterval) clearInterval(recordingTimerInterval);
      recordingTimerInterval = null;
    }

    function encodeWAV(buffers, sampleRate) {
      // 將多個 Float32Array 串接成一個
      const length = buffers.reduce((sum, b) => sum + b.length, 0);
      const pcmData = new Float32Array(length);
      let offset = 0;
      for (const b of buffers) {
        pcmData.set(b, offset);
        offset += b.length;
      }

      // 轉成 16-bit PCM
      const buffer = new ArrayBuffer(44 + pcmData.length * 2);
      const view = new DataView(buffer);

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      let pos = 0;
      // RIFF header
      writeString(view, pos, 'RIFF'); pos += 4;
      view.setUint32(pos, 36 + pcmData.length * 2, true); pos += 4;
      writeString(view, pos, 'WAVE'); pos += 4;

      // fmt chunk
      writeString(view, pos, 'fmt '); pos += 4;
      view.setUint32(pos, 16, true); pos += 4; // chunk size
      view.setUint16(pos, 1, true); pos += 2;  // PCM
      view.setUint16(pos, 1, true); pos += 2;  // mono
      view.setUint32(pos, sampleRate, true); pos += 4;
      view.setUint32(pos, sampleRate * 2, true); pos += 4; // byte rate
      view.setUint16(pos, 2, true); pos += 2;  // block align
      view.setUint16(pos, 16, true); pos += 2; // bits per sample

      // data chunk
      writeString(view, pos, 'data'); pos += 4;
      view.setUint32(pos, pcmData.length * 2, true); pos += 4;

      // PCM data
      let offsetBytes = pos;
      for (let i = 0; i < pcmData.length; i++, offsetBytes += 2) {
        let s = Math.max(-1, Math.min(1, pcmData[i]));
        view.setInt16(offsetBytes, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }

      return new Blob([view], { type: 'audio/wav' });
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        mediaStream = audioContext.createMediaStreamSource(stream);
        scriptNode = audioContext.createScriptProcessor(4096, 1, 1);

        recordingBuffers = [];

        scriptNode.onaudioprocess = (event) => {
          const input = event.inputBuffer.getChannelData(0);
          recordingBuffers.push(new Float32Array(input));
        };

        mediaStream.connect(scriptNode);
        scriptNode.connect(audioContext.destination);

        startTimer();
        recordBtn.textContent = '■ 停止錄音';
        recordBtn.disabled = false;
        resetRecordingBtn.disabled = true;
        setStatus(recordingStatus, '錄音中… 請演奏單音旋律。');
      } catch (err) {
        console.error(err);
        setStatus(recordingStatus, '無法取得麥克風權限，請確認瀏覽器設定。');
      }
    }

    async function stopRecording() {
      try {
        if (scriptNode) {
          scriptNode.disconnect();
          scriptNode.onaudioprocess = null;
          scriptNode = null;
        }
        if (mediaStream) {
          mediaStream.disconnect();
          mediaStream = null;
        }
        if (audioContext) {
          await audioContext.close();
          audioContext = null;
        }

        stopTimer();

        // 產生 WAV Blob
        const sampleRate = 44100; // 多數瀏覽器會是 44100 或 48000
        const wavBlob = encodeWAV(recordingBuffers, sampleRate);
        recordedBlob = wavBlob;

        const url = URL.createObjectURL(wavBlob);
        previewAudio.src = url;
        previewAudio.style.display = 'block';

        recordTimer.textContent = '已錄製完成，可以進行分析與編曲。';
        setStatus(recordingStatus, '');
        analyzeBtn.disabled = false;
        resetRecordingBtn.disabled = false;
        recordBtn.textContent = '🎙 開始錄音';
      } catch (err) {
        console.error(err);
        setStatus(recordingStatus, '處理錄音資料時發生錯誤：' + err.message);
      }
    }

    recordBtn.addEventListener('click', () => {
      if (!audioContext) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    resetRecordingBtn.addEventListener('click', () => {
      recordedBlob = null;
      previewAudio.src = '';
      previewAudio.style.display = 'none';
      recordTimer.textContent = '尚未錄音';
      setStatus(recordingStatus, '');
      analyzeBtn.disabled = true;
      renderBtn.disabled = true;
      playBtn.disabled = true;
      lastAnalyzeResult = null;
      lastMidiBlob = null;
      lastAIChords = null;
      downloadLink.style.display = 'none';
      setStatus(analysisInfo, '');
      setStatus(aiChordsInfo, '');
      setStatus(renderStatus, '');
    });

    async function callAnalyze() {
      if (!recordedBlob) {
        setStatus(analysisInfo, '請先錄音。');
        return;
      }

      setStatus(analysisInfo, '上傳並分析中…');
      renderBtn.disabled = true;
      playBtn.disabled = true;
      lastAnalyzeResult = null;
      lastAIChords = null;
      setStatus(aiChordsInfo, '');

      const formData = new FormData();
      const file = new File([recordedBlob], 'recording.wav', { type: 'audio/wav' });
      formData.append('file', file);

      try {
        const res = await fetch('/analyze-audio', {
          method: 'POST',
          body: formData,
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error('分析失敗：' + text);
        }

        const data = await res.json();
        lastAnalyzeResult = data;

        // 將偵測到的 bpm 帶入輸入框
        if (typeof data.bpm === 'number') {
          bpmInput.value = Math.round(data.bpm);
        }

        const noteCount = (data.notes || []).length;
        setStatus(
          analysisInfo,
          `偵測到約 ${noteCount} 個音符\nBPM ≈ ${Math.round(data.bpm)}，調性推測：${data.key}`
        );

        renderBtn.disabled = false;
        aiChordsBtn.disabled = false; // 已有分析結果，可以請 AI 幫忙給和弦
      } catch (err) {
        console.error(err);
        setStatus(analysisInfo, '分析時發生錯誤：' + err.message);
        aiChordsBtn.disabled = true;
      }
    }

    analyzeBtn.addEventListener('click', () => {
      callAnalyze();
    });

    async function callAICompose() {
      if (!lastAnalyzeResult) {
        setStatus(aiChordsInfo, '請先完成音訊分析。');
        return;
      }

      const bpm = Number(bpmInput.value) || lastAnalyzeResult.bpm || 90;
      const key = lastAnalyzeResult.key || 'C';
      const notes = lastAnalyzeResult.notes || [];

      if (!notes.length) {
        setStatus(aiChordsInfo, '沒有偵測到有效音符，無法請 AI 建議和弦。');
        return;
      }

      // 粗略估計需要幾個小節（4/4）
      const totalDuration = notes.reduce((max, n) => Math.max(max, n.end || 0), 0);
      let estBars = Math.ceil((totalDuration * bpm) / 60 / 4);
      if (!estBars || estBars < 4) estBars = 4;
      if (estBars > 8) estBars = 8;

      setStatus(aiChordsInfo, '向本地 AI 請求和弦建議中…');
      aiChordsBtn.disabled = true;

      try {
        const res = await fetch('/ai-compose', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            notes,
            bpm,
            key,
            num_bars: estBars,
          }),
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error('AI 和弦失敗：' + text);
        }

        const data = await res.json(); // { chords: [...] }
        lastAIChords = data.chords || [];

        if (!lastAIChords.length) {
          setStatus(aiChordsInfo, 'AI 回傳的和弦為空，請再試一次。');
          aiChordsBtn.disabled = false;
          return;
        }

        setStatus(
          aiChordsInfo,
          'AI 建議和弦：' + lastAIChords.join(' | ')
        );
        aiChordsBtn.disabled = false;
        renderBtn.disabled = false;
      } catch (err) {
        console.error(err);
        setStatus(aiChordsInfo, 'AI 建議和弦時發生錯誤：' + err.message);
        aiChordsBtn.disabled = false;
      }
    }

    aiChordsBtn.addEventListener('click', () => {
      callAICompose();
    });

    // --- 音階生成旋律（地端演算法，不需錄音） ---
    const rootSelect = document.getElementById('rootSelect');
    const scaleSelect = document.getElementById('scaleSelect');
    const customNotesWrap = document.getElementById('customNotesWrap');
    const customNotesInput = document.getElementById('customNotesInput');
    const barsInput = document.getElementById('barsInput');
    const generateMelodyBtn = document.getElementById('generateMelodyBtn');
    const playMelodyBtn = document.getElementById('playMelodyBtn');
    const melodyStatus = document.getElementById('melodyStatus');

    scaleSelect.addEventListener('change', () => {
      customNotesWrap.style.display = scaleSelect.value === 'custom' ? 'flex' : 'none';
    });

    async function callGenerateMelody() {
      const body = {
        root: rootSelect.value,
        scale_type: scaleSelect.value,
        bpm: Number(bpmInput.value) || 90,
        num_bars: Number(barsInput.value) || 4,
      };
      if (scaleSelect.value === 'custom') {
        const names = customNotesInput.value.trim().split(/[\s,]+/).filter(Boolean);
        if (!names.length) {
          setStatus(melodyStatus, '請輸入自訂音名，例如：C D E G A');
          return;
        }
        body.custom_notes = names;
      }

      setStatus(melodyStatus, '生成旋律中…');
      generateMelodyBtn.disabled = true;

      try {
        const res = await fetch('/generate-melody', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error('生成失敗：' + text);
        }

        const data = await res.json(); // { notes, bpm, key }
        // 生成的旋律直接當成「分析結果」，可以走原本的 AI 和弦 / 編曲流程
        lastAnalyzeResult = data;
        lastAIChords = null;
        lastMidiBlob = null;

        setStatus(
          melodyStatus,
          `已生成 ${data.notes.length} 個音符（${data.key} 調，${body.num_bars} 小節）。可以試聽，或直接進行 AI 和弦 / 編曲。`
        );
        setStatus(analysisInfo, `使用生成的旋律：${data.key} 調，BPM ${Math.round(data.bpm)}`);

        playMelodyBtn.disabled = false;
        renderBtn.disabled = false;
        aiChordsBtn.disabled = false;
      } catch (err) {
        console.error(err);
        setStatus(melodyStatus, '生成旋律時發生錯誤：' + err.message);
      } finally {
        generateMelodyBtn.disabled = false;
      }
    }

    generateMelodyBtn.addEventListener('click', () => {
      callGenerateMelody();
    });

    async function playGeneratedMelody() {
      if (!lastAnalyzeResult || !lastAnalyzeResult.notes || !lastAnalyzeResult.notes.length) {
        setStatus(melodyStatus, '尚未生成旋律。');
        return;
      }
      try {
        await Tone.start();
        const synth = new Tone.PolySynth(Tone.Synth).toDestination();
        const now = Tone.now() + 0.3;
        for (const n of lastAnalyzeResult.notes) {
          const freq = Tone.Frequency(n.midi, 'midi');
          synth.triggerAttackRelease(freq, n.end - n.start, now + n.start, (n.velocity || 90) / 127);
        }
        setStatus(melodyStatus, '播放旋律中…');
      } catch (err) {
        console.error(err);
        setStatus(melodyStatus, '播放時發生錯誤：' + err.message);
      }
    }

    playMelodyBtn.addEventListener('click', () => {
      playGeneratedMelody();
    });

    async function callRender() {
      if (!lastAnalyzeResult) {
        setStatus(renderStatus, '請先完成音訊分析。');
        return;
      }

      const bpm = Number(bpmInput.value) || lastAnalyzeResult.bpm || 90;
      const key = lastAnalyzeResult.key || 'C';
      const notes = lastAnalyzeResult.notes || [];

      const body = {
        notes,
        bpm,
        key,
        lyrics: {
          verse: '輕輕地，我們一起，唱出心中的歌。',
          chorus: '這是，創造的，屬於我們的旋律。',
        },
        chord_overrides: lastAIChords && lastAIChords.length ? lastAIChords : undefined,
      };

      setStatus(renderStatus, '編曲與產生 MIDI 中…');
      renderBtn.disabled = true;
      playBtn.disabled = true;

      try {
        const res = await fetch('/render-music', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error('編曲失敗：' + text);
        }

        const blob = await res.blob();
        lastMidiBlob = blob;

        // 提供下載連結
        const url = URL.createObjectURL(blob);
        downloadLink.href = url;
        downloadLink.style.display = 'inline-block';

        setStatus(renderStatus, '已產生 MIDI，可以下載或直接在線上播放。');
        renderBtn.disabled = false;
        playBtn.disabled = false;
      } catch (err) {
        console.error(err);
        setStatus(renderStatus, '產生 MIDI 時發生錯誤：' + err.message);
        renderBtn.disabled = false;
      }
    }

    renderBtn.addEventListener('click', () => {
      callRender();
    });

    async function playMidi() {
      if (!lastMidiBlob) {
        setStatus(renderStatus, '尚未產生 MIDI。');
        return;
      }

      try {
        setStatus(renderStatus, '載入 MIDI 並播放中…');

        const arrayBuffer = await lastMidiBlob.arrayBuffer();
        const midi = new Midi(arrayBuffer);

        await Tone.start();
        const now = Tone.now() + 0.5; // 稍微延遲避免爆音

        // 簡化：一個 PolySynth 撐起所有旋律與和聲，鼓 / bass 先不分音色
        const synth = new Tone.PolySynth(Tone.Synth).toDestination();

        midi.tracks.forEach((track) => {
          track.notes.forEach((note) => {
            const time = now + note.time;
            synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
          });
        });

        setStatus(renderStatus, '播放中… 若要再次播放，請稍待數秒。');
      } catch (err) {
        console.error(err);
        setStatus(renderStatus, '播放 MIDI 時發生錯誤：' + err.message);
      }
    }

    playBtn.addEventListener('click', () => {
      playMidi();
    });

    // 初始狀態：尚未錄音，僅允許按「開始錄音」
    analyzeBtn.disabled = true;
    aiChordsBtn.disabled = true;
    renderBtn.disabled = true;
    playBtn.disabled = true;
  </script>
</body>
</html>
